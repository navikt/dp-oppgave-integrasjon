name: Test dependency PRs

on:
  workflow_dispatch:
  merge_group:
  push:
    branches:
      - 'dependabot/**'
      - 'renovate/**'
      - 'update-digests'

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-java@v6.0.1
        with:
          distribution: temurin
          java-version: 26.0.2+10
      - uses: gradle/actions/setup-gradle@v6.3.0
      - run: ./gradlew --configuration-cache test
